# Render Blueprint — NestJS API. The database lives on Neon, the site on Vercel.
services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string, entered in the Render dashboard
      - key: CORS_ORIGIN
        sync: false # Vercel URL of the site, e.g. https://prenomnom.vercel.app
