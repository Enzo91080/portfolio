packages:
  - apps/*
  - packages/*

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  '@parcel/watcher': false
  '@swc/core': false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.7"
  - "@turbo/darwin-arm64@2.11.7"
  - "@turbo/linux-64@2.11.7"
  - "@turbo/linux-arm64@2.11.7"
  - "@turbo/windows-64@2.11.7"
  - "@turbo/windows-arm64@2.11.7"
  - "@types/node@24.19.1"
  - framer-motion@14.0.0
  - icu-minify@4.14.9
  - motion-dom@14.0.0
  - motion-utils@14.0.0
  - motion@14.0.0
  - next-intl-swc-plugin-extractor@4.14.9
  - next-intl@4.14.9
  - turbo@2.11.7
  - use-intl@4.14.9
